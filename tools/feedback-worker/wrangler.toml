# Fred's feedback server (#247): takes ratings from the app, keeps them in D1.
# Setup and reading the ratings: README.md.
name = "fred-feedback"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "fred-feedback"
# From `wrangler d1 create fred-feedback` (2026-11-19). Not a secret: only this account can use it.
database_id = "ee9c0fe4-4a83-4d5f-8ae7-5b4dd57e1109"

# 30 ratings a minute from one address is far past what a hiker taps;
# past it, the app keeps the rating and tries again later.
[[ratelimits]]
name = "LIMITER"
namespace_id = "2471"
simple = { limit = 30, period = 60 }
